<style>
:root{--bg:#f1eee7;--panel:#ffffff;--ink:#1f2933;--muted:#667380;--line:#d8d3c6;--accent:#0b6e8a;--accent-ink:#ffffff;--chip:#eef1f3;--warn:#b4541a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12171b;--panel:#1b2127;--ink:#e8ecef;--muted:#98a2ac;--line:#2e3740;--accent:#4cc3e0;--accent-ink:#06222a;--chip:#252d35;--warn:#f0a070}}
:root[data-theme="dark"]{--bg:#12171b;--panel:#1b2127;--ink:#e8ecef;--muted:#98a2ac;--line:#2e3740;--accent:#4cc3e0;--accent-ink:#06222a;--chip:#252d35;--warn:#f0a070}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app{display:flex;height:100%;width:100%}
#view{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#panel{width:350px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:8px 13px;font:inherit;font-weight:600;cursor:pointer;min-height:38px}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#handle{display:none;flex:none;border:0;background:transparent;color:var(--muted);font:inherit;padding:2px;min-height:22px;cursor:pointer}
.body{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 18px;-webkit-overflow-scrolling:touch}
.sec{display:none}.sec.on{display:block}
h3{margin:14px 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
h3:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
button.b{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:10px 8px;font:inherit;font-weight:600;cursor:pointer;min-height:42px}
button.b:active{transform:scale(.98)}
button.b.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.b.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.b.w{color:var(--warn)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;min-height:40px}
.row label{flex:1}
.row small,.muted{color:var(--muted)}
input[type=range]{width:100%;height:30px;accent-color:var(--accent);margin:2px 0}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--chip);color:var(--ink);padding:10px 6px;font:inherit;font-weight:600;cursor:pointer;min-height:42px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--chip);margin:8px 0}
.card .t{font-weight:700;font-size:15px}
.card dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.card dt{color:var(--muted)}.card dd{margin:0}
.card ol,.card ul{margin:6px 0 0;padding-left:20px}.card li{margin:5px 0}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px}
.stb{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:9px 11px;font:inherit;cursor:pointer;margin-bottom:6px;min-height:44px}.stb.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.stb b{min-width:24px;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.35);vertical-align:-2px;margin-right:8px}
.mk{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);min-height:44px}
.mk .nm{flex:1;min-width:0}.mk .nm b{margin-right:6px}
.mk .ct{color:var(--muted);font-variant-numeric:tabular-nums}
.mk button{min-width:40px;min-height:36px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
.mk button.on{background:var(--accent);color:var(--accent-ink)}
#chip{position:absolute;left:10px;top:10px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:12px;padding:8px 11px;pointer-events:none;max-width:70%}
#chip b{display:block;font-size:14px}#chip span{color:var(--muted);font-size:12px}
#fab{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
#fab button{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 90%,transparent);color:var(--ink);font:inherit;font-size:18px;cursor:pointer}
#fab button.on{background:var(--accent);color:var(--accent-ink)}
.lbl{position:absolute;left:0;top:0;pointer-events:none;font-weight:800;font-size:13px;color:var(--muted);transform:translate(-50%,-50%);text-shadow:0 0 4px var(--bg),0 0 4px var(--bg)}
#tag{position:absolute;left:0;top:0;pointer-events:none;background:var(--accent);color:var(--accent-ink);font-weight:800;padding:3px 8px;border-radius:8px;transform:translate(-50%,-140%);display:none;white-space:nowrap}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;max-width:88%;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25);transition:opacity .4s}
@media (max-width:860px){
  #app{flex-direction:column}
  #panel{width:100%;height:46%;border-left:0;border-top:1px solid var(--line)}
  #panel.collapsed{height:auto}
  #panel.collapsed .body{display:none}
  #handle{display:block}
  #chip{max-width:58%}
}
</style>
</head>

    <div id="toast"></div>

</div>

var STAGES=[{"n":1,"title":"Разметка осей и свайный фундамент","short":"Фундамент","days":"1–1,5","crew":"3 чел.","works":["Расчистить площадку, снять растительный слой в пятне 6 × 5 м, выровнять. Вынести условный уровень ±0,000 от репера.","Разбить оси: прямоугольник 4700 × 3700 по осям свай (внешний габарит здания 5000 × 4000). Диагонали: 5982 по осям свай и 6403 по габариту, допуск ±10 мм.","Отметить 12 основных свай (X = 150, 1750, 3300, 4850; Y = 150, 2000, 3850) и 2 дополнительные С13, С14 под опорные стойки конька (X = 2500; Y = 150 и 3850). Отдельно — 4 сваи Ø108×2500 террасы.","Ввернуть сваи Ø108×2500 вертикально (отклонение ≤ 1 %), довести голову до +0,350 с записью усилия закручивания в журнал.","Приварить оголовки (плиты 200×200), зачистить и защитить от коррозии, выставить головы по нивелиру: разброс по высоте ≤ 5 мм.","Составить исполнительную схему свай (отклонения по осям и высоте)."],"control":["Геология подтверждена: несущая способность ≥ 45 кН на сваю и проверка на выдёргивание (СТОП-ТОЧКА до начала свай).","Оси и диагонали в допуске, вертикальность свай ≤ 1 %.","Голова свай на +0,350 ± 5 мм, оголовки защищены."],"tools":"нивелир или лазерный уровень, рулетка 30 м, шнур и колышки, ключ-вороток для свай (или гидромашина), сварочный аппарат, болгарка, антикоррозионный состав","mats":"сваи винтовые Ø108×2500 — 14 шт.; плиты оголовков 200×200; электроды; антикоррозионный состав; (4 сваи Ø108×2500 террасы)"},{"n":2,"title":"Ростверк: пакеты досок 50×150, углы и Т-стыки лесенкой","short":"Ростверк","days":"1,5","crew":"3 чел.","works":["Антисептировать доски 50×150 (торцы дважды), на плитах оголовков уложить гидроизоляционную прокладку (капиллярный разрыв).","Уложить наружные пакеты Г1 (юг) и Г3 (север): доски на ребро, бок о бок, наружный ряд первым; стыки каждой доски — только над плитой, соседних — в разбежку (над С2 и С3).","Уложить Г4 (запад) и Г5 (восток); углы собрать ступенчатой «лесенкой»: длинные доски Г1/Г3 доходят до угла, каждая следующая на 50 мм короче, короткие заполняют ступени.","Уложить средний пакет Г2 (3 доски) и собрать Т-стыки с Г4/Г5 ступенями 50 / 100 / 50 над сваями С5 и С8 (узел Б, лист КР-02а).","Стянуть пакеты шпильками (ориентир M12, шайбы 50×50×4): поперёк пакетов и в узлах Б1–Б3; диаметр и шаг — по расчёту конструктора.","Выставить ростверк по уровню (верх +0,500, перепад ≤ 3 мм на 3 м) и по диагоналям (разность ≤ 5 мм), закрепить к оголовкам скобами."],"control":["В каждом пакете не более 4 досок; стыки над опорами, в створе не более двух стыков.","Верх ростверка +0,500 ± 3 мм, диагонали равны.","Все шпильки затянуты, шайбы на месте; прокладки не выступают."],"tools":"рулетка, лазерный уровень, уровень 2 м, шуруповёрт/дрель, торцевые ключи, кисти для антисептика, молоток","mats":"доска 50×150: наружные пакеты 4 доски, средний 3 доски; шпильки M12; шайбы 50×50×4; гидроизоляционная лента; антисептик"},{"n":3,"title":"Обвязка пола и сплошные лаги пола 2×50×150","short":"Лаги пола","days":"1","crew":"2–3 чел.","works":["Разметить на ростверке линии лаг и перегородок. Лаги идут от Г1 до Г3 одним куском (3700 мм), без деления на зоны; под печью — две дополнительные пары.","Уложить обвязку пола ОН: 2 доски 50×150 на ребро по периметру на внешнюю часть пакетов ростверка — под будущие стены; стыки в разбежку. Торцы лаг будут упираться в неё.","Собрать пары лаг: две доски 50×150 скрепить по длине (шаг крепежа — по расчёту). Уложить пары на верх Г1, Г2 и Г3 (опирание на Г1 и Г3 не менее 100 мм, на Г2 — по всей ширине), шаг 660 (560 в свету), верх +0,650; концы прибить к обвязке ОН.","Под перегородкой X = 2500, между лагами X = 1940 и X = 2720, поставить блоки Л3: по 4 доски 50×150 стопкой, длина ≈ 460, на подвесах к лагам с шагом 600 (Y ≈ 2300, 2900, 3500) — прерывистая лага из кусков. Перегородка Y = 2000 идёт поперёк лаг: она опирается на каждую лагу и на Г2 под ними.","Проверить плоскость: верх всех лаг +0,650 ± 2 мм (одна плоскость на всём этаже), перепад ≤ 2 мм на 2 м; ничего не подрезать и не сверлить в лагах и ростверке."],"control":["Лаги сплошные, лежат на Г1, Г2 и Г3; концы упираются в ОН.","Блоки Л3 стоят по линии X = 2500, Л4 — под печью.","Верх всех лаг +0,650 ± 2 мм."],"tools":"уровень, рулетка, шуруповёрт, оцинкованные подвесы и гвозди по паспорту, лазерный уровень","mats":"доска 50×150: лаги — 9 пар по 3,7 м, обвязка ОН — 8 досок по периметру, блоки Л3 — 12 коротышей; подвесы"},{"n":4,"title":"Подпольные сети: ввод воды, канализация, кабель","short":"Подпольные сети","days":"1","crew":"2 чел.","works":["Проложить коллектор К1 DN110 по оси X = 2900 с уклоном 0,02 на отметке −0,600 к северной стороне, ревизию вынести за северную стену.","От трапов поставить стояки DN50 (парная — X 1000, Y 2950; моечная — X 4400, Y 3400) и соединить с К1 горизонтальными участками DN50 (уклон 0,03) ниже ростверка.","Проложить ввод воды В1 (ПЭ32) с севера по X = 2700, поднять до уровня техузла в футляре; греющий кабель и утепление всей траншейной части.","Оставить закладные гильзы под кабель ввода и трубы в местах, согласованных с лагами (между лагами, не пересекая ростверк).","Опрессовать водяной ввод, налить канализацию на герметичность; составить акт скрытых работ с фото."],"control":["Испытания пройдены ДО закрытия пола (СТОП-ТОЧКА).","Уклоны: DN50 — 0,03, DN110 — 0,02.","Трубы ниже ростверка (ниже +0,350), не пересекают лаги и ростверк."],"tools":"лопата/бур, лазерный нивелир, трубный инструмент (для ПЭ/ПП), греющий кабель, манометр, опрессовочный насос","mats":"труба ПП DN110 и DN50; труба ПЭ32; греющий кабель; утеплитель трубы; уплотнители, фасонные части; гильзы"},{"n":5,"title":"Утепление и настил пола 50 мм (одна плоскость), мокрая зона","short":"Настил пола","days":"1,5","crew":"3 чел.","works":["Снизу: черновая обрешётка под лагами (доска 100×22, зазор 50) → ветро-влагозащитная мембрана → вата 150 между лагами без пустот → фольга/паробарьер с проклейкой стыков.","Настил 50 мм по всему этажу, в том числе под стенами и перегородками: фанера ФСФ 22 (шпунт, длинной стороной поперёк лаг, стыки только на лагах, ряды в разбежку) + верхний слой 28 мм. Верх настила +0,700.","Сухая зона: верхний слой 28 — шпунтованная доска чистового пола. Мокрые комнаты (парная, моечная): верхний слой — ЦСП 12 + выравнивание 16; гидроизоляция единой системой с подъёмом на стены 200 мм и на фланцы трапов.","Стяжка 25–45 мм по уклону 1,5–2 % к трапам и плитка по клею (верх ≈ +0,790): мокрые комнаты выше сухой зоны на ≈ 90 мм — порог между комнатой отдыха и мокрыми помещениями.","Стены и перегородки ставить на настил (+0,700) после его укладки; стяжку и плитку выполнять после установки перегородок (этап 14)."],"control":["Утеплитель без пустот, барьер сплошной, стыки проклеены.","Настил в одной плоскости: +0,700 ± 3 мм, стыки на лагах.","Налив воды 24 ч в мокрых комнатах до плитки без протечек (СТОП-ТОЧКА)."],"tools":"строительный нож, сшиватель, шуруповёрт, правило, уровень, кисти/валики гидроизоляции, зубчатый шпатель","mats":"мембрана; минвата 150 негорючая; фольга/паробарьер и клейкая лента; фанера ФСФ 22; доска 28 шпунт, ЦСП 12; гидроизоляция; стяжка; плитка"},{"n":6,"title":"Наружные стены первого этажа: панели 50×100, раскосы, пакеты 200","short":"Наружные стены","days":"2","crew":"4 чел.","works":["Собрать панели на полу в порядке: южная S (вход), западная W, северная N, восточная E (последней). Нижняя обвязка 50×100, верхняя двойная 2×50×100 с перевязкой стыков.","Стойки 50×100 с шагом 620 (560 в свету); углы и оси — пакеты 200 (4 доски 50×100 в ряд); под конёк — пакеты ПФ (X 2400–2600) в панелях S и N.","Вставить распорки 50×100 на середине высоты в каждой панели, по 2 стойки 50×100 с каждой стороны проёма, ригели проёмов (Д1, ОК-1 и панорамное ОК-3: 4×50×100 = 100×200, ОК-2: 2×50×100); в узких простенках южной стены у углов — крестовые связи из стальной перфоленты 40×2, подоконные бруски, коротыши.","Врезать раскосы 50×100 в крайние панели под ≈ 65° до подъёма панелей.","Поднять панели в проектное положение, поставить на нижнюю обвязку, поставить временные укосины в двух направлениях, проверить вертикаль по отвесу/уровню 2 м.","Прижать нижнюю обвязку к ростверку анкерами (ориентир M12 через 1200 мм и у пакетов), соединить панели в углах, перевязать верхние обвязки."],"control":["Вертикаль ≤ 3 мм на 2 м, диагонали коробки равны (разность ≤ 5 мм).","Все раскосы врезаны, распорки на месте, пакеты 200 в углах и под конёк.","Анкеры затянуты, временные укосины остаются до установки перекрытия."],"tools":"уровень 2 м, отвес, шуруповёрт, пневмо- или ручной молоток, болгарка/пила для врезок, временные укосины, струбцины","mats":"брус 50×100 — стойки, обвязки, распорки, раскосы, ригели, пакеты 200; анкеры; гвозди/саморезы по паспорту"},{"n":7,"title":"Перегородки 100 мм: Y = 2000 и X = 2500, закладные","short":"Перегородки","days":"1","crew":"3 чел.","works":["Перегородка Y = 2000 (комната отдыха / парная и моечная) стоит на настиле поперёк лаг над ростверком Г2: нижняя обвязка 50×100 шурупами 6×120 через настил в каждую лагу и в Г2; проёмы Д2, Д3 и тоннель печи 300×400.","Перегородка X = 2500 (парная / моечная) стоит на настиле над блоками Л3 (по линии X = 2500): нижняя обвязка шурупами в блоки через настил, шаг 300; стойки 50×100 шаг 620, обвязки, распорки. Верх — уголками к лагам мансарды и упорам 50×100 между лагами.","Закладные 50×100 под бойлер, полок и ограждение печи; обрамление тоннеля печи — негорючее.","Скрепить перегородки с наружными стенами (концевые пары 2×50 шурупами 6×140 в пакет стены, шаг 400) и между собой (Т-узел X = 2500 на перегородке Y = 2000), верхние обвязки подготовить под уголки к лагам мансарды. Подробно — лист «Перегородки: опирание и крепление»."],"control":["Проёмы по размерам: Д2 и Д3 700×1900, тоннель 300×400, проверить диагонали проёмов.","Закладные на высоте: бойлер 1300–1700, полки — по чертежу."],"tools":"уровень, шуруповёрт, струбцины, рулетка","mats":"брус 50×100, 50×150; анкеры, уголки, гвозди"},{"n":8,"title":"Перекрытие мансарды (потолок 1 этажа): пары лаг 2×50×250, тримеры, проёмы","short":"Перекрытие мансарды","days":"1,5","crew":"4 чел.","works":["Сначала поставить обвязку перекрытия ОП по периметру на верхние обвязки стен: по W и E две доски 50×250, по S и N одну — она замыкает торцы лаг и несёт коленные стены и фронтоны. Затем уложить пары лаг М1 по верхним обвязкам S/N (опирание не менее 50 мм): X = 220, 880, 2160, 2940, 3520, 4180, 4780; шаг не более 660.","Сформировать проём Л1 1300×1300 под лестницу Ø1200 (X 1360–2660, Y 150–1450): тримеры Т1 (X ≈ 1260) и Т2 (X ≈ 2760), ригель Р1 (Y 1450–1600).","Проём Л2 под проходной узел дымохода 500×500: тримеры Т3 (3×50×250, X 2250–2400) и Т4 (4×50×250, X 1440–1640), ригели Р3 (Y 1920–2070) и Р4 (Y 2570–2720). Между Т3 и Т2 поставить три упора УП (50×250) под верхнюю обвязку перегородки X = 2500.","Поставить бриджинг на Y ≈ 2400, закрепить лаги уголками/лентами к верхним обвязкам (по расчёту).","Настил: фанера ФСФ 22 (1220×2440, шпунт) длинной стороной поперёк лаг, торцевые стыки только на лагах X = 880, 1260, 2760, 2940, ряды в разбежку; листы вырезать под проёмы Л1 и Л2; шуруп 4,5×45 шаг 150/300. Это диафрагма жёсткости и основание под пол 2 этажа (подложка 10 + чистовое покрытие 18). Ограждение проёмов сразу после настила."],"control":["Не более 4 досок в пакете, в т. ч. тримеры; шаг лаг ≤ 660.","Проёмы Л1 и Л2 по размерам, временное ограждение установлено.","Перекрытие плоское: перепад ≤ 3 мм на 2 м."],"tools":"уровень, шуруповёрт, пила, уголки/подвесы, струбцины, ограждение проёмов","mats":"доска 50×250 (ОП, пары, тримеры, ригели, упоры, бриджинг); фанера ФСФ 22 ≈ 20 шт. листов и обрезков; уголки, ленты"},{"n":9,"title":"Коленные стены и фронтоны (южный и северный)","short":"Колени и фронтоны","days":"1,5","crew":"4 чел.","works":["Собрать коленные стены W/E высотой 850 (стойки 50×100 шаг 620, обвязка 50 и 2×50, распорки); поднять, поставить на настил над ОП и закрепить шурупами 6×140 через настил в ОП (шаг 300) и лентами к стойкам стены первого этажа.","Собрать каркасы фронтонов S и N на настиле: стойки 50×100 шаг 620, ригели на +4,70, раскосы 50×100, опорный пакет ПФ по X = 2400–2600.","Южный фронтон: два высоких окна ОК-М1, М2 700×1900 по обе стороны пакета ПФ; северный — два малых 600×900.","Поднять фронтоны, выставить в вертикаль, раскрепить временными укосинами к перекрытию, связать с коленными стенами."],"control":["Вертикаль фронтонов ≤ 3 мм на 2 м; пакеты ПФ в створе свай С13 и С14.","Проёмы окон по размерам, ригели на месте."],"tools":"уровень 2 м, отвес, шуруповёрт, временные укосины, средства подъёма и страховки на высоте","mats":"стойки 50×100, ригели 50×100/50×150, раскосы 50×100; анкеры; доски для укосин"},{"n":10,"title":"Коньковый прогон и стропила 50×250","short":"Конёк и стропила","days":"2","crew":"4 чел.","works":["Поднять коньковый прогон КП 4×50×300 (составной из 4 досок) на пакеты ПФ южной и северной стен, зафиксировать опорными пластинами/уголками, раскрепить от опрокидывания.","Разметить стропила: шаг 395 по Y (13 на скат; крайние — на свесах Y = −250 и 4250), отвесный срез у граней КП.","Уложить стропила 50×250 верхним концом к боковым граням КП, нижним — на верхнюю обвязку коленной стены со скользящей опорой (скоба с пазом).","Сдвоить стропила по сторонам прохода дымохода (Y ≈ 2000 и 2790), поставить обрамление прохода.","Диагональные ветровые связи 25×150 по низу стропил в крайних пролётах каждого ската; ленточные анкеры стропило–обвязка и ПФ–КП (по расчёту)."],"control":["Верх стропил на конце — на уровне верха КП (+7,080).","Шаг стропил ≤ 400, скользящие опоры не закреплены намертво.","Ветровые связи установлены; временные укосины фронтонов сняты только после связей."],"tools":"лебёдка/блоки или подъёмник для КП, шаблоны стропил, уровень, шуруповёрт, страховочные пояса, леса/подмости","mats":"КП 4×50×300 × 4,6; стропила 50×250 × 4,0 (27 шт.); доски 50×100 (ветровые связи); скобы, ленты"},{"n":11,"title":"Кровельный пирог и покрытие","short":"Кровля","days":"2","crew":"3–4 чел.","works":["Раскрыть стропила изнутри: утеплитель 250 между стропилами + поперечный слой 50, паробарьер, сервисный зазор и подшивка — после кровли.","Снаружи: диффузионная мембрана по стропилам, контрейка 50 (вентканал), обрешётка 25×100 по профилю покрытия.","Покрытие: профнастил С-20 (или иной металл) с коньком, торцевыми планками, снегозадержателями.","Проходки: дымоход Ø115 (сэндвич, проходной элемент) выше конька не менее 0,5 м — оголовок +7,80; фановый стояк DN110 — выше кровли не менее 0,3 м.","Водосток и свесы: 400 по скатам и 300 по фронтонам; нижний продух и конёк вентиляционные."],"control":["Вентканалы открыты внизу и вверху.","Проходки герметичны, дымоход на положенной высоте.","Крепление покрытия по инструкции производителя."],"tools":"подмости, подъёмник, нож, ножницы по металлу, шуруповёрт, герметик, страховка на крыше","mats":"мембрана; контрейка 50×50; обрешётка 25×100; профнастил С-20 ≈ 40 м² с доборными; проходки"},{"n":12,"title":"Водоснабжение и водоотведение: внутренняя разводка","short":"Вода","days":"1,5","crew":"2 чел.","works":["Установить техузел (фильтр, гидробак 24 л, автоматика насоса) и накопительный бойлер 80 л у северной стены моечной на закладной в каркасе.","Разводка PP-R/PEX DN20 по сервисным зонам стен: ХВС и ГВС к душу (восточная стена, X 4800), к крану, к бойлеру; ни одна труба не пересекает ростверк и лаги.","Поставить трапы: в парной — точечный трап DN50 с сухим затвором, в моечной — линейный трап 600 мм у восточной стены (душ без поддона); трапы двухуровневые — фланцы под обе гидроизоляции.","Фановый стояк DN110 в коробе в юго-восточном углу моечной, вывести через мансарду и кровлю (≥ 0,3 м над поверхностью), утеплить.","Опрессовать горячую и холодную линии (1,5 × рабочее давление), проверить уклоны, запустить насос, настроить автоматику."],"control":["Опрессовка пройдена, течи нет (СТОП-ТОЧКА до закрытия стен).","Все краны и клапаны доступны, сливной кран бойлера и зимний слив работают."],"tools":"трубный сварочный аппарат (PP-R) или пресс (PEX), манометр, опрессовочный насос, ключи, уровень","mats":"PP-R/PEX DN20; краны; бойлер 80 л; техузел; трапы DN50; стояк DN110; манжеты; крепёж"},{"n":13,"title":"Электрика и освещение","short":"Электрика","days":"1,5","crew":"2 чел. (электрик)","works":["Ввод 1ф 220 В кабелем в трубе (ориентир ≈ 5 кВт, вводной автомат С32), ЩР в сухой зоне у входа (комната отдыха, X ≈ 4500).","Групповые линии (по схеме ЭОМ-01): освещение Г1/Г2, розетки Г3/Г4, водонагреватель Г5, насос Г6, греющий кабель Г7, конвекторы Г8; дифавтоматы 30 мА на мокрые линии.","Кабель вне парной — ВВГнг(А)-LS в гофре по сервисным зонам; в парной — термостойкий кабель и светильник 125 °C, без розеток.","Светильники: Л1 IP44 (комната отдыха), Л2 IP65 (моечная), Л3 IP65 125 °C (парная); выключатели вне парной.","Уравнивание потенциалов (трубы, трапы, дымоход), заземление по системе СНТ; замеры сопротивления изоляции и петли фаза-ноль."],"control":["Проверка УЗО и замеры до закрытия стен (СТОП-ТОЧКА).","Сечения и защита по расчёту; мощность подтверждена техусловиями СНТ."],"tools":"мультиметр, тестер УЗО, мегомметр, кабельный инструмент, гофра и крепёж","mats":"щит ЩР, автоматы и дифавтоматы, кабель ВВГнг(А)-LS и термостойкий, светильники IP44/IP65, выключатели, розетки"},{"n":14,"title":"Окна и двери, утепление, защита, обшивка, полы и потолки (под ключ)","short":"Под ключ","days":"8","crew":"4 чел.","works":["Закрыть контур: окна ОК-1, ОК-2, ОК-3 (панорамное 1300×600), ОК-М1…М4 и двери Д1–Д3 на пену с лентами (ПСУЛ снаружи, пароизоляционная изнутри), отливы.","Утеплитель — каменная вата без пустот: стены и перегородки 100, колени и фронтоны 100, пол мансарды 250, скаты 250 + 50 поперёк стропил.","Снаружи: ветро-влагозащитная мембрана → брусок 20×40 (вентзазор, низ и верх открыты, сетка) → имитация бруса 20×145 горизонтально, обшивка ростверка до +0,350.","Изнутри: пароизоляция с проклейкой; в парной — фольга единым контуром (нахлёст ≥ 100, алюминиевый скотч); брусок 20×40 и вагонка — липа/осина в парной, хвоя в остальных помещениях и в мансарде.","Мокрая зона: ЦСП 12, гидроизоляция единой системой, стяжка по уклону к трапам, плитка; в душе — ЦСП и плитка до 1,8 м. Сухая зона и мансарда — шпунтованная доска; потолки — вагонка по бруску; полок и решётчатый трап в парной."],"control":["Фольга и пароизоляция без разрывов, стыки проклеены; налив 24 ч в мокрой зоне пройден (СТОП-ТОЧКА).","Вентзазоры фасада и кровли открыты; утеплитель без пустот.","Количества — по ведомости КР-12 (площади и объёмы из 3D-модели)."],"tools":"нож, сшиватель, степлер, шуруповёрт, торцовочная пила, уровень, плиточный инструмент, монтажный пистолет","mats":"каменная вата 100/150/250/50; мембраны, пароизоляция, фольга и ленты; имитация бруса 20×145; вагонка липа и хвоя; брусок 20×40; ЦСП 12; гидроизоляция; плитка; доска пола 28; окна и двери"},{"n":15,"title":"Лестница, печь, дымоход, вентиляция; пуск и приёмка","short":"Печь и пуск","days":"2","crew":"3 чел.","works":["Поставить печь «Диана Скала Порта» на негорючее основание, топочный тоннель 150 в перегородке, экран; собрать дымоход Ø115 (сэндвич) через проходной узел 400×400 и кровлю.","Установить винтовую лестницу Ø1200 напротив топки: торцы ступеней 2–3 — сиденье; негорючие накладки на торцы ступеней 1–4 до получения паспорта печи.","Вентиляция: клапаны В-1 … В-5 по плану ИС-02, переток в Д3, зазор под Д2; три независимые системы — дымоход, вентиляция, стояк.","Конвекторы ЭК-1 (комната отдыха) и ЭК-2 (мансарда), настройка термостатов.","Пробные протопки по инструкции: контроль тяги, температуры древесины за фольгой, герметичности; акт приёмки."],"control":["Паспорт печи получен, отступы выполнены (СТОП-ТОЧКА до первой топки).","Тяга в норме, дымоход герметичен, температура древесины за фольгой ≤ 50 °C.","Приёмка скрытых работ с фотографиями и актами."],"tools":"уровень, шуруповёрт, ключи, анемометр/дымовая шашка для проверки тяги, термометр","mats":"печь с экраном и основанием; дымоход Ø115; винтовая лестница Ø1200; клапаны; конвекторы"},{"n":16,"title":"Терраса под навесом вдоль южного фасада","short":"Терраса","days":"4","crew":"3 чел.","works":["Ввернуть 4 сваи Ø108×2500 по линии Y = −1375 (X = 150, 1750, 3300, 4850), голова +0,350, оголовки.","Наружная балка — 3 доски 50×150 на сваях; опорный брус 50×150 на ростверке Г1 (болты M12 через 600 сквозь все доски Г1).","Лаги 50×150 с шагом 606 от опорного бруса до балки (уклон настила 1 % от стены); настил — террасная доска лиственница 28×140 с зазором 5–10 мм, верх +0,678 (на 22 мм ниже порога Д1).","Столбы навеса 2×50×100 над сваями, передний прогон 2×50×250 (низ +2,850), опорный брус навеса на стене под окнами фронтона (глухари в ОП), стропила 50×150 через 606 с уклоном ≈ 15°, обрешётка 25×100, профнастил С-20; примыкание к стене — планка и герметик.","Перила высотой 900 от настила: стойки 2×50×100, две доски 50×100 на ребро и поручень 50×150 плашмя. Ступени к Д1: 3 косоура 50×250, проступи по 2 доски 50×150, подъём ≈ 170."],"control":["Уровень настила и уклон 1 % от стены; зазоры досок одинаковые.","Навес не перекрывает окна фронтона (низ окон +3,800), вода с навеса уходит от стены.","Перила 0,9 м, подъёмы ступеней одинаковые."],"tools":"ключ для свай, сварка, уровень, торцовочная пила, шуруповёрт, струбцины, подмости","mats":"сваи Ø108×2500 (4), доски 50×150, 50×100, 50×250; террасная доска лиственница 28×140; профнастил С-20 с планками; обрешётка 25×100; болты M12, глухари, саморезы; масло для террасы"}];
var STCAM={1:[0.55,13,-0.6],2:[0.6,12,0.2],3:[0.6,12,0.3],4:[0.6,12,0.0],5:[0.6,12,0.4],6:[0.5,13,1.9],7:[0.7,12,1.6],8:[0.55,13,2.4],9:[0.5,14,3.5],10:[0.5,15,4.0],11:[0.5,15,4.0],12:[0.85,12,1.4],13:[0.85,12,1.4],14:[0.7,13,2.5],15:[0.85,12,1.6],16:[0.45,16,2.4]};
var N=DATA.length, M=[], frameCount=0;
for(var i=0;i<N;i++){
  var d=DATA[i], v=[], c=[0,0,0];
  for(var k=0;k<8;k++){var X=d.v[k*3],Y=d.v[k*3+1],Z=d.v[k*3+2]; var p=[(X-2500)/1000,Z/1000,-(Y-2000)/1000]; v.push(p); c[0]+=p[0]/8;c[1]+=p[1]/8;c[2]+=p[2]/8;}
  var o={i:i,m:d.m,g:d.g,w:d.w,s:d.s,l:d.l,n:d.n,vol:d.vol,v:v,c:c,ctx:d.g==='ctx',ex:d.k==='x',st:d.st,rank:0};
  M.push(o); if(!o.ex)frameCount++;
}

var order=M.filter(function(o){return !o.ex;}).sort(function(a,b){
  var ga=GORDER.indexOf(a.g),gb=GORDER.indexOf(b.g); if(ga!==gb)return ga-gb;
  if(Math.abs(a.c[1]-b.c[1])>0.02)return a.c[1]-b.c[1];
  if(Math.abs(a.c[0]-b.c[0])>0.02)return a.c[0]-b.c[0]; return a.c[2]-b.c[2];});
order.forEach(function(o,k){o.rank=k;});
// векторы разнесения
var cen={}; var cnt={};
M.forEach(function(o){var key=o.g+'|'+o.w; if(!cen[key]){cen[key]=[0,0,0];cnt[key]=0;} cen[key][0]+=o.c[0];cen[key][1]+=o.c[1];cen[key][2]+=o.c[2];cnt[key]++;});
Object.keys(cen).forEach(function(k){cen[k]=cen[k].map(function(x){return x/cnt[k];});});
M.forEach(function(o){
  var out=[0,0],key=o.g+'|'+o.w;
  if(o.w==='S')out=[0,1]; else if(o.w==='N')out=[0,-1]; else if(o.w==='W')out=[-1,0]; else if(o.w==='E')out=[1,0];
  else if(o.g==='кол')out=[o.c[0]<0?-1:1,0]; else if(o.g==='фр')out=[0,o.c[2]>0?1:-1];

  o.exL=[out[0]*0.9,L*0.85,out[1]*0.9];
  var cc=cen[key]; o.exB=o.ex?[0,0,0]:[(o.c[0]-cc[0])*0.55,(o.c[1]-cc[1])*0.55,(o.c[2]-cc[2])*0.55];
});
var marks={}; M.forEach(function(o){if(o.ex)return; if(!marks[o.m])marks[o.m]={m:o.m,n:o.n,c:0,vol:0}; marks[o.m].c++; marks[o.m].vol+=o.vol;});
var markList=Object.keys(marks).map(function(k){return marks[k];});
var totalVol=0; M.forEach(function(o){if(!o.ex)totalVol+=o.vol;});
var sameCount={}; M.forEach(function(o){var k=o.m+'|'+o.s; sameCount[k]=(sameCount[k]||0)+1;});

  if(ui.step){ui.step.value=S.step;ui.stepv.textContent=ui.stepf(S.step);}
  GORDER.forEach(function(g){if(layerRows[g])layerRows[g].checked=S.groups[g];});
  if(ui.ctx)ui.ctx.checked=S.groups.ctx; if(ui.clipOn)ui.clipOn.checked=S.clip.on; if(ui.stOnly)ui.stOnly.checked=S.stageOnly; if(ui.stDim)ui.stDim.checked=S.stageDim;
  bPlay.textContent=S.playing?'❚❚ Пауза':'▶ Сборка';
  document.getElementById('fExp').classList.toggle('on',S.expT>0.5);document.getElementById('fRot').classList.toggle('on',S.auto);
  renderMarks();stepInfo();renderAll();renderStage();
}
function renderAll(){var n=0;M.forEach(function(o){if(!o.ex&&isVisible(o))n++;});document.getElementById('stat').textContent=(S.stage>0?('Этап '+S.stage+' из '+STAGES.length+' · '+STAGES[S.stage-1].short+' · '):'')+'Видно досок: '+n+' из '+frameCount;}
document.getElementById('info').innerHTML='Досок и брусьев: '+frameCount+'<br>Объём древесины каркаса: '+totalVol.toFixed(2)+' м³ (без запаса)<br>Основа — брус 50×100; также 50×150, 50×250, клееный 200×400<br>Оси: X — на восток, Y — на север от юго-западного угла.';
renderBoard();

// панель на телефоне
var handle=document.getElementById('handle');
function setHandle(){handle.textContent=panelEl.classList.contains('collapsed')?'▴ Инструменты':'▾ Свернуть';}
handle.onclick=function(){panelEl.classList.toggle('collapsed');setHandle();setTimeout(resize,30);};
setHandle();
window.addEventListener('resize',function(){resize();});
if(window.ResizeObserver){new ResizeObserver(function(){resize();}).observe(document.getElementById('view'));}
document.getElementById('fHome').onclick=function(){goPreset('iso');};
document.getElementById('fExp').onclick=function(){setExplode(S.expT>0.5?0:1,true);};
document.getElementById('fRot').onclick=function(){S.auto=!S.auto;syncUI();};

/* ---------- цикл ---------- */
var last=performance.now();
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  stepTween(now);
  if(S.auto&&ptrCount()===0&&!tween)CAM.yaw+=dt*0.25;
  var k=1-Math.exp(-dt*7);S.explode+=(S.expT-S.explode)*k; if(Math.abs(S.expT-S.explode)<0.0005)S.explode=S.expT;
  if(S.playing){S.stepF=(S.stepF==null?S.step:S.stepF)+dt*45*S.speed;var ns=Math.min(frameCount,Math.floor(S.stepF));if(ns!==S.step){S.step=ns;S.flash=order[Math.max(0,ns-1)]?order[Math.max(0,ns-1)].i:-1;S.flashT=now;if(ui.step){ui.step.value=S.step;ui.stepv.textContent=ui.stepf(S.step);}stepInfo();renderAll();}
    if(S.step>=frameCount){S.playing=false;S.stepF=null;syncUI();}}
  else S.stepF=null;
  draw(now);
  requestAnimationFrame(frame);
}
resize(); goPreset('iso'); tween=null; CAM.yaw=0.78;CAM.pitch=0.5;CAM.dist=15;CAM.t=[0,3.2,0];
syncUI();
requestAnimationFrame(frame);
setTimeout(function(){toast('Вращайте пальцем, щипком — масштаб, тап по доске — информация',4200);},500);
// для проверки
window.__v={setStage:setStage,STAGES:STAGES,S:S,M:M,select:doSelect,pick:pick,setExplode:setExplode,order:order,setView:setView,CAM:CAM,showAll:showAll};
})();
</script>
</body>
